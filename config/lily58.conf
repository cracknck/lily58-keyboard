# Uncomment to enable encoder
# CONFIG_EC11=y
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y


# General
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_KEYBOARD_NAME="MR ROBOT"


# OLED Display
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
CONFIG_ZMK_WIDGET_LAYER_STATUS=y
CONFIG_ZMK_WIDGET_WPM_STATUS=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=n
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y


# Bluetooth
#CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# RGB LED
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y

# Color blanco fijo
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=0
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=0
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=30
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=0

# Ahorro de batería
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y

# External power
# CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
